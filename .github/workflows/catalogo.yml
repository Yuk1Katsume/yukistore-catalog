name: Actualizar catálogo

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch:          # botón "Run workflow"
  repository_dispatch:        # aviso desde otros repos al publicar
    types: [nueva-version]
  push:
    branches: [main]
    paths: [fuentes.json, scripts/**, iconos/**, capturas/**]

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generar_catalogo.py

      - name: Guardar cambios
        run: |
          if git diff --quiet -- apps.json; then
            echo "Catálogo sin cambios."
            exit 0
          fi
          git config user.name "yukistore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "Catálogo actualizado"
          git push
